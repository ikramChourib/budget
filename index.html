<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Budget Commun</title>
<meta name="theme-color" content="#4a2f9e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --paper:#f6f5fa; --card:#ffffff; --ink:#221c33; --muted:#6b6480; --line:#e3dfee; --rule:#ecebf5;
  --accent:#4a2f9e; --accent-soft:#ece7fb; --accent-ink:#ffffff;
  --good:#1d7a52; --good-soft:#e2f4ea; --bad:#b8352e; --bad-soft:#fbe7e5; --warn:#9a6a00;
  --perso:#c9a2f2; --reste:#7fcfa6;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --paper:#15121f; --card:#1f1a2e; --ink:#eeeaf7; --muted:#a49cbb; --line:#342c4a; --rule:#2a2340;
  --accent:#a58cf5; --accent-soft:#2e2550; --accent-ink:#15121f;
  --good:#5fd39b; --good-soft:#173528; --bad:#f08a82; --bad-soft:#3d1c1c; --warn:#e6b650;
  --perso:#7a5bc0; --reste:#3f9c70;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#15121f; --card:#1f1a2e; --ink:#eeeaf7; --muted:#a49cbb; --line:#342c4a; --rule:#2a2340;
  --accent:#a58cf5; --accent-soft:#2e2550; --accent-ink:#15121f;
  --good:#5fd39b; --good-soft:#173528; --bad:#f08a82; --bad-soft:#3d1c1c; --warn:#e6b650;
  --perso:#7a5bc0; --reste:#3f9c70;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 96px}
.wrap{max-width:560px;margin:0 auto}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500;letter-spacing:-.01em}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:14px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--rule)}
.brand{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.02em;flex:1;min-width:0;white-space:nowrap}
.brand small{overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted);letter-spacing:0}
.monthnav{display:flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.monthnav button{border:0;background:none;width:32px;height:32px;border-radius:50%;font-size:18px;line-height:1}
.monthnav button:hover{background:var(--accent-soft)}
.monthnav span{font-weight:700;font-size:14px;min-width:104px;text-align:center;text-transform:capitalize}

h2{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.02em;margin:22px 0 4px;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:17px;margin:22px 0 8px}
.lede{color:var(--muted);margin:0 0 14px;font-size:14px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}

/* segmented */
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:9px 6px;border-radius:9px;font-weight:700;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* pot hero */
.pot{margin-top:16px;padding:18px;border-radius:16px;background:var(--accent);color:var(--accent-ink)}
.pot .eyebrow{color:inherit;opacity:.8}
.pot .big{font-family:var(--mono);font-size:34px;font-weight:500;letter-spacing:-.03em;margin:2px 0 6px}
.pot .sub{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;opacity:.9}

/* member cards */
.members{display:grid;gap:12px;margin-top:14px}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.mhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mname{font-family:var(--display);font-weight:600;font-size:18px}
.chip{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.bad{background:var(--bad-soft);color:var(--bad)}
.bar{display:flex;height:10px;border-radius:6px;overflow:hidden;margin:12px 0 10px;background:var(--rule)}
.bar i{display:block;height:100%}
.bar .b1{background:var(--accent)} .bar .b2{background:var(--perso)} .bar .b3{background:var(--reste)}
.rows{display:grid;gap:4px}
.row{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.row span:first-child{color:var(--muted);display:flex;align-items:center;gap:7px}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block}
.row.total{border-top:1px dashed var(--line);padding-top:6px;margin-top:4px;font-weight:700}
.row.total span:first-child{color:var(--ink)}
.pos{color:var(--good)} .neg{color:var(--bad)}

/* compare */
.tablewrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:10px 10px;text-align:right;border-bottom:1px solid var(--rule);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
tr.sel td{background:var(--accent-soft)}
tr:last-child td{border-bottom:0}
td button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 10px;font-size:12.5px;font-weight:700}

.alert{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--bad-soft);color:var(--bad);font-size:14px}
.note{font-size:13px;color:var(--muted);margin-top:10px}

/* ledger lines (notebook feel) */
.ledger{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.line{display:grid;grid-template-columns:1fr 112px 36px;align-items:center;border-bottom:1px solid var(--rule)}
.line input{border:0;background:transparent;padding:12px 12px;min-width:0;width:100%}
.line input.amt{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.line input:focus{background:var(--accent-soft);outline:none}
.line .del{border:0;background:none;color:var(--muted);font-size:20px;height:100%}
.line .del:hover{color:var(--bad)}
.ledfoot{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--rule)}
.ledfoot strong{font-family:var(--mono);font-weight:500}
.add{border:0;background:none;color:var(--accent);font-weight:700;padding:4px 0}

.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;font-weight:700;width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.stack{display:grid;gap:10px}
.mlist{display:grid;gap:8px}
.mitem{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.mitem.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.mitem .t{flex:1;min-width:0}
.mitem .t b{text-transform:capitalize;display:block}
.mitem .t small{color:var(--muted)}
.mitem button{border:0;background:none;color:var(--accent);font-weight:700}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:10px 12px;font-size:14px}
.confirm button{border:0;border-radius:8px;padding:6px 12px;font-weight:700;background:var(--bad);color:#fff}
.confirm button.no{background:transparent;color:var(--bad)}

.pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.pills button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:700;font-size:13.5px;white-space:nowrap}
.pills button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1;border:0;background:none;padding:9px 2px 10px;font-size:11.5px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent)}

.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);z-index:9;transition:opacity .2s}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:700}

/* report tables */
.rt{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow-x:auto}
.rt table td,.rt table th{padding:9px 8px;font-size:13px}
.rt td:first-child,.rt th:first-child{white-space:normal;min-width:96px;padding-left:12px}
.rt td:last-child,.rt th:last-child{padding-right:12px}
.rt td button{white-space:normal;text-align:left;line-height:1.25}
.rt thead th{font-size:10.5px;letter-spacing:.05em}
.rt tr.tot td{font-weight:700;background:var(--rule)}
.rt tr.key td{font-weight:700}
.rt td small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.person{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.person .ph{padding:10px 12px;font-family:var(--display);font-weight:600;background:var(--rule)}
.line.fixed{grid-template-columns:1fr 112px 12px}
.line label{padding:12px;color:var(--muted)}
.tag{font-size:11px;font-weight:700;color:var(--good);margin-left:6px}
.step{display:flex;align-items:center;gap:8px}
.step b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:12px;font-family:var(--body)}
.cta{margin-top:22px}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Budget Commun<small id="modeLabel"></small></div>
    <div class="monthnav">
      <button id="prevM" aria-label="Mois précédent">‹</button>
      <span id="monthLabel"></span>
      <button id="nextM" aria-label="Mois suivant">›</button>
    </div>
  </header>
  <main id="view"></main>
</div>

<nav class="tabs"><div class="in" id="tabs"></div></nav>
<div class="toast" id="toast" hidden></div>
<input type="file" id="importFile" accept="application/json" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
const KEY='budget-commun-v2';
const uid=()=>Math.random().toString(36).slice(2,9);
const r2=n=>Math.round((+n||0)*100)/100;
const eur=n=>r2(n).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const pct=n=>(Math.round((n||0)*1000)/10).toLocaleString('fr-FR')+' %';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sum=a=>a.reduce((t,x)=>t+(+x.amount||0),0);
const clone=o=>JSON.parse(JSON.stringify(o));
const monthName=k=>{const[y,m]=k.split('-');return new Date(+y,+m-1,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'})};
const cap=t=>t.charAt(0).toUpperCase()+t.slice(1);
const nextKey=k=>{let[y,m]=k.split('-').map(Number);m++;if(m>12){m=1;y++}return y+'-'+String(m).padStart(2,'0')};
const thisMonth=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const SPLITS={egal:'50/50',prorata:'Prorata des revenus',commun:'Tout en commun'};
const SPLITS_LONG={egal:'50/50',prorata:'Prorata des revenus (recommandé)',commun:'Tout en commun, reste partagé à égalité'};
const MODES={solo:'Solo',couple:'Couple',groupe:'Groupe'};
const FIXES=['Loyer','Électricité','Assurance voiture','Crédit voiture','Internet','Essence','Salle de sport','Claude','Apple'];
const VARS=['Courses','Restaurants','Coffee','Provision entretien voiture','Provision voyage','Bricolage'];
const PERSO=[['forfait','Forfait mobile'],['perso','Dépenses perso'],['credits','Crédits perso']];

const person=n=>({id:'m_'+uid(),name:'Personne '+n,salary:0,forfait:0,perso:0,credits:0});
function blankMonth(n){return{split:'prorata',members:Array.from({length:n},(_,i)=>person(i+1)),
  fixes:FIXES.map(name=>({id:uid(),name,amount:0})),variables:VARS.map(name=>({id:uid(),name,amount:0}))}}
function seed(){const k=thisMonth();return{v:2,mode:'couple',current:k,months:{[k]:blankMonth(2)}}}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||S.v!==2||!S.months||!Object.keys(S.months).length) S=seed();
let tab='saisie', pending=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const M=()=>S.months[S.current];
const keys=()=>Object.keys(S.months).sort();
const members=m=>S.mode==='solo'?m.members.slice(0,1):m.members;

function compute(m,split){
  split=split||m.split;
  const mem=members(m),n=mem.length||1,solo=S.mode==='solo';
  const fixes=sum(m.fixes),vars=sum(m.variables),pot=fixes+vars;
  const total=mem.reduce((t,x)=>t+(+x.salary||0),0);
  const rows=mem.map(x=>{
    const sal=+x.salary||0,share=total?sal/total:1/n;
    let contrib;
    if(solo) contrib=pot;
    else if(split==='egal') contrib=pot/n;
    else if(split==='prorata') contrib=pot*share;
    else contrib=sal-(total-pot)/n;
    const out=(+x.forfait||0)+(+x.perso||0)+(+x.credits||0);
    const reste=sal-contrib-out;
    return{id:x.id,name:x.name,salary:sal,share,contrib,forfait:+x.forfait||0,perso:+x.perso||0,credits:+x.credits||0,reste,taux:sal?reste/sal:0};
  });
  return{fixes,vars,pot,total,rows,split,n};
}

/* ---------- views ---------- */
const ICONS={
  saisie:'<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg>',
  resultats:'<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  mois:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  reglages:'<svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>'
};
const TABS=[['saisie','Saisie'],['resultats','Résultats'],['mois','Mois'],['reglages','Réglages']];
const fmtIn=v=>+v?String(r2(v)).replace('.',','):'';

function render(){
  document.getElementById('monthLabel').textContent=monthName(S.current);
  document.getElementById('modeLabel').textContent=MODES[S.mode]+(S.mode!=='solo'?' · '+SPLITS[M().split]:'');
  const k=keys(),i=k.indexOf(S.current);
  document.getElementById('prevM').disabled=i<=0;
  document.getElementById('nextM').disabled=i>=k.length-1;
  document.getElementById('tabs').innerHTML=TABS.map(([id,l])=>`<button data-tab="${id}" ${tab===id?'aria-current="page"':''}>${ICONS[id]}${l}</button>`).join('');
  document.getElementById('view').innerHTML={saisie:vSaisie,resultats:vResultats,mois:vMois,reglages:vReglages}[tab]();
}

function ledger(list,path,title,totalLabel){
  return `<h3 class="step">${title}</h3><div class="ledger">${list.map(l=>`<div class="line">
    <input id="n_${l.id}" data-path="${path}" data-id="${l.id}" data-f="name" value="${esc(l.name)}" aria-label="Poste">
    <input id="a_${l.id}" class="amt" data-path="${path}" data-id="${l.id}" data-f="amount" inputmode="decimal" placeholder="0,00" value="${fmtIn(l.amount)}" aria-label="Montant ${esc(l.name)}">
    <button class="del" data-del="${path}" data-id="${l.id}" aria-label="Supprimer ${esc(l.name)}">×</button></div>`).join('')}
    <div class="ledfoot"><button class="add" data-add="${path}">+ Ajouter une ligne</button><span>${totalLabel} <strong>${eur(sum(list))}</strong></span></div></div>`;
}

function vSaisie(){
  const m=M(),mem=members(m),solo=S.mode==='solo',c=compute(m);
  let h=`<h2>Saisie de ${monthName(S.current)}</h2><p class="lede">Remplissez les montants mensuels. Les résultats se calculent tout seuls.</p>
  <div class="seg" role="group" aria-label="Type de budget">${Object.entries(MODES).map(([k,l])=>`<button data-mode="${k}" aria-pressed="${S.mode===k}">${l}</button>`).join('')}</div>`;
  // Revenus
  h+=`<h3 class="step"><b>1</b>Revenus</h3><div class="ledger">`+mem.map(x=>`<div class="line">
    <input id="mn_${x.id}" data-mem="${x.id}" data-f="name" value="${esc(x.name)}" aria-label="Nom">
    <input id="ms_${x.id}" class="amt" data-mem="${x.id}" data-f="salary" inputmode="decimal" placeholder="Salaire net" value="${fmtIn(x.salary)}" aria-label="Salaire net de ${esc(x.name)}">
    ${S.mode==='groupe'&&mem.length>2?`<button class="del" data-delmem="${x.id}" aria-label="Retirer ${esc(x.name)}">×</button>`:'<span></span>'}</div>`).join('')
    +`<div class="ledfoot">${S.mode==='groupe'?'<button class="add" data-act="addmem">+ Ajouter une personne</button>':'<span class="note" style="margin:0">Nom et salaire net mensuel</span>'}<span>Total <strong>${eur(c.total)}</strong></span></div></div>`;
  h+=ledger(m.fixes,'fixes','<b>2</b>Dépenses fixes '+(solo?'':'communes'),'Total fixes');
  h+=ledger(m.variables,'variables','<b>3</b>Dépenses variables '+(solo?'':'communes'),'Total variables');
  h+=`<h3 class="step"><b>4</b>Dépenses personnelles</h3><div class="stack">`+mem.map(x=>`<div class="person"><div class="ph">${esc(x.name)}</div>`+
    PERSO.map(([f,l])=>`<div class="line fixed"><label for="p_${f}_${x.id}">${l}</label>
      <input id="p_${f}_${x.id}" class="amt" data-mem="${x.id}" data-f="${f}" inputmode="decimal" placeholder="0,00" value="${fmtIn(x[f])}"><span></span></div>`).join('')+`</div>`).join('')+`</div>
  <p class="note">Dépenses perso : loisirs, shopping, sorties… payés par chacun. Crédits perso : remboursements personnels.</p>
  <div class="cta"><button class="btn primary" data-tab="resultats">Voir les résultats <span>→</span></button></div>`;
  return h;
}

function vResultats(){
  const m=M(),c=compute(m),solo=S.mode==='solo',R=c.rows;
  let h=`<h2>Résultats de ${monthName(S.current)}</h2>`;
  if(!c.total&&!c.pot) h+=`<div class="alert" style="background:var(--accent-soft);color:var(--accent)">Commencez par saisir les salaires et les dépenses dans l'onglet Saisie.</div>`;
  if(!solo) h+=`<p class="lede">Règle de partage du compte commun :</p><div class="seg" role="group" aria-label="Répartition">${Object.entries(SPLITS).map(([k,l])=>`<button data-split="${k}" aria-pressed="${m.split===k}">${l}</button>`).join('')}</div>`;
  h+=`<div class="pot"><div class="eyebrow">${solo?'Dépenses du foyer':'Pot commun mensuel'}</div><div class="big">${eur(c.pot)}</div>
    <div class="sub"><span>Total fixes <b class="num">${eur(c.fixes)}</b></span><span>Total variables <b class="num">${eur(c.vars)}</b></span></div></div>`;
  const neg=R.filter(r=>r.reste<0);
  if(neg.length) h+=`<div class="alert"><b>${neg.map(r=>esc(r.name)).join(', ')}</b> dépense${neg.length>1?'nt':''} plus que ${neg.length>1?'leur salaire':'son salaire'} avec cette répartition.</div>`;
  // Revenus
  h+=`<h3>Revenus</h3><div class="rt"><table><thead><tr><th>Revenus</th><th>Salaire net</th>${solo?'':'<th>Part</th>'}</tr></thead><tbody>`
    +R.map(r=>`<tr><td>${esc(r.name)}</td><td class="num">${eur(r.salary)}</td>${solo?'':`<td class="num">${pct(r.share)}</td>`}</tr>`).join('')
    +(solo?'':`<tr class="tot"><td>Total</td><td class="num">${eur(c.total)}</td><td class="num">100 %</td></tr>`)+`</tbody></table></div>`;
  // Répartition
  const lines=[['Salaire',r=>eur(r.salary)],...(solo?[]:[['Part des revenus',r=>pct(r.share)]]),
    [solo?'Dépenses du foyer':'Virement au compte commun',r=>r.contrib<0?`${eur(-r.contrib)}<small>à recevoir</small>`:eur(r.contrib),'key'],
    ['Forfait mobile',r=>eur(r.forfait)],['Dépenses perso',r=>eur(r.perso)],['Crédits perso',r=>eur(r.credits)],
    ['Reste pour épargner',r=>`<span class="${r.reste<0?'neg':'pos'}">${eur(r.reste)}</span>`,'tot'],
    ["Taux d'épargne",r=>`<span class="${r.reste<0?'neg':''}">${pct(r.taux)}</span>`]];
  h+=`<h3>${solo?'Mon budget':'Répartition · '+SPLITS[m.split]}</h3><div class="rt"><table><thead><tr><th></th>${R.map(r=>`<th>${esc(r.name)}</th>`).join('')}</tr></thead><tbody>`
    +lines.map(([l,f,cls])=>`<tr class="${cls||''}"><td>${l}</td>${R.map(r=>`<td class="num">${f(r)}</td>`).join('')}</tr>`).join('')+`</tbody></table></div>`;
  // Comparaison
  if(!solo){
    h+=`<h3>Comparaison des options</h3><div class="rt"><table><thead><tr><th>Option</th>${R.map(r=>`<th>${esc(r.name)}</th>`).join('')}</tr></thead><tbody>`;
    for(const k of Object.keys(SPLITS)){
      const cc=compute(m,k);
      h+=`<tr class="${m.split===k?'sel':''}"><td>${m.split===k?`<b>${SPLITS_LONG[k]}</b> ✓`:`<button data-split="${k}">${SPLITS_LONG[k]}</button>`}</td>`
        +cc.rows.map(r=>`<td class="num">${eur(r.contrib)}<small>reste <span class="${r.reste<0?'neg':''}">${eur(r.reste)}</span></small></td>`).join('')+`</tr>`;
    }
    h+=`</tbody></table></div><p class="note">Chaque case montre le virement au compte commun puis le reste pour épargner. 50/50 : chacun paie la même part. Prorata : chacun paie selon son salaire. Tout en commun : les salaires sont mis ensemble, et ce qui reste après les dépenses communes est partagé à égalité.</p>`;
  }
  h+=`<div class="cta stack"><button class="btn" data-act="xmonth">Exporter ${monthName(S.current)} en Excel <span>↓</span></button></div>`;
  return h;
}

function vMois(){
  const k=keys().slice().reverse();
  let h=`<h2>Mes mois</h2><p class="lede">Chaque mois garde sa propre saisie. Le nouveau mois reprend le dernier comme modèle.</p>
  <div class="stack"><button class="btn primary" data-act="gen">Générer ${monthName(nextKey(keys().at(-1)))} <span>＋</span></button>
  <button class="btn" data-act="xmonth">Exporter ${monthName(S.current)} en Excel <span>↓</span></button>
  <button class="btn" data-act="xall">Exporter tous les mois en Excel <span>↓</span></button></div><h3>Historique</h3><div class="mlist">`;
  for(const key of k){
    const c=compute(S.months[key]),rs=c.rows.reduce((t,r)=>t+r.reste,0);
    if(pending===('del:'+key)){h+=`<div class="confirm">Supprimer ${monthName(key)} ? <button data-act="delyes" data-k="${key}">Supprimer</button><button class="no" data-act="cancel">Annuler</button></div>`;continue}
    h+=`<div class="mitem ${key===S.current?'cur':''}"><div class="t"><b>${monthName(key)}</b><small>Pot <span class="num">${eur(c.pot)}</span> · Épargne <span class="num ${rs<0?'neg':''}">${eur(rs)}</span></small></div>
      ${key===S.current?'<span class="chip">Ouvert</span>':`<button data-open="${key}">Ouvrir</button>`}
      ${k.length>1?`<button data-act="del" data-k="${key}" aria-label="Supprimer ${monthName(key)}" style="color:var(--muted)">×</button>`:''}</div>`;
  }
  return h+`</div>`;
}
function vReglages(){
  let h=`<h2>Réglages</h2><h3>Sauvegarde</h3><p class="lede">Les données restent sur ce téléphone. Exportez une sauvegarde pour les retrouver sur un autre appareil.</p>
  <div class="stack"><button class="btn" data-act="backup">Exporter une sauvegarde (.json) <span>↓</span></button>
  <button class="btn" data-act="restore">Importer une sauvegarde <span>↑</span></button>`;
  h+=pending==='reset'?`<div class="confirm">Effacer tous les mois et repartir de zéro ? <button data-act="resetyes">Effacer</button><button class="no" data-act="cancel">Annuler</button></div>`
    :`<button class="btn danger" data-act="reset">Tout effacer <span>⟲</span></button>`;
  return h+`</div><h3>Comment ça marche</h3><p class="lede">1. Saisissez les revenus, les dépenses communes et les dépenses perso.<br>2. Choisissez la répartition dans Résultats.<br>3. Chaque mois, générez le mois suivant et ajustez ce qui change.<br>4. Exportez en Excel quand vous voulez.</p>`;
}

/* ---------- actions ---------- */
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,3200)}
const listAt=path=>M()[path];
const parseNum=v=>{const n=parseFloat(String(v).replace(/\s|€/g,'').replace(',','.'));return isNaN(n)?0:n};

document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.path){const l=listAt(t.dataset.path).find(x=>x.id===t.dataset.id);if(!l)return;l[t.dataset.f]=t.dataset.f==='amount'?parseNum(t.value):t.value;save();render();}
  else if(t.dataset.mem){const id=t.dataset.mem,f=t.dataset.f;
    if(f==='name'){for(const k in S.months){const x=S.months[k].members.find(y=>y.id===id);if(x)x.name=t.value}}
    else{const x=M().members.find(y=>y.id===id);if(x)x[f]=parseNum(t.value)}
    save();render();}
});
document.getElementById('importFile').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const d=JSON.parse(rd.result);if(d.v!==2||!d.months)throw 0;S=d;save();tab='resultats';render();toast('Sauvegarde importée')}catch(_){toast("Ce fichier n'est pas une sauvegarde Budget Commun.")}};
  rd.readAsText(f);e.target.value='';
});
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(b.id==='prevM'||b.id==='nextM'){const k=keys(),i=k.indexOf(S.current)+(b.id==='prevM'?-1:1);if(k[i]){S.current=k[i];save();render()}return}
  if(d.tab){tab=d.tab;pending=null;render();window.scrollTo(0,0);return}
  if(d.split){M().split=d.split;save();render();return}
  if(d.add){const l={id:uid(),name:'',amount:0};listAt(d.add).push(l);save();render();const el=document.getElementById('n_'+l.id);if(el)el.focus();return}
  if(d.del){const a=listAt(d.del),i=a.findIndex(x=>x.id===d.id);if(i>-1)a.splice(i,1);save();render();return}
  if(d.open){S.current=d.open;save();tab='resultats';render();return}
  if(d.mode){setMode(d.mode);return}
  if(d.delmem){for(const k in S.months){const m=S.months[k];if(m.members.length>2)m.members=m.members.filter(x=>x.id!==d.delmem)}save();render();return}
  switch(d.act){
    case 'gen':{const last=keys().at(-1),nk=nextKey(last),m=clone(S.months[last]);m.fixes.forEach(l=>l.id=uid());m.variables.forEach(l=>l.id=uid());S.months[nk]=m;S.current=nk;save();tab='saisie';render();toast(cap(monthName(nk))+' créé à partir de '+monthName(last));break}
    case 'del':pending='del:'+d.k;render();break;
    case 'delyes':delete S.months[d.k];if(!S.months[S.current])S.current=keys().at(-1);pending=null;save();render();toast('Mois supprimé');break;
    case 'cancel':pending=null;render();break;
    case 'xmonth':exportXlsx([S.current]);break;
    case 'xall':exportXlsx(keys());break;
    case 'addmem':{const n=M().members.length+1,p=person(n);for(const k in S.months)if(k>=S.current)S.months[k].members.push(clone(p));save();render();break}
    case 'backup':download(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),'budget-commun-sauvegarde.json');break;
    case 'restore':document.getElementById('importFile').click();break;
    case 'reset':pending='reset';render();break;
    case 'resetyes':S=seed();pending=null;tab='saisie';save();render();toast('Toutes les données ont été effacées');break;
  }
});
function setMode(mode){
  S.mode=mode;
  const need={solo:1,couple:2,groupe:3}[mode];
  for(const k in S.months){const m=S.months[k];
    while(m.members.length<need)m.members.push(person(m.members.length+1));
    if(mode==='couple'&&m.members.length>2)m.members=m.members.slice(0,2);
  }
  save();render();
}
function download(blob,name){
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
  toast('Téléchargement de '+name+' lancé');
}

/* ---------- Excel ---------- */
const ZE='#,##0.00 "€"',ZP='0.0%';
function sheetFrom(rows,widths){
  const ws={};let maxC=0;
  rows.forEach((row,r)=>row.forEach((v,c)=>{
    if(v==null||v==='')return;let cell;
    if(typeof v==='object')cell={t:'n',f:v.f,v:r2(v.v)+0,z:v.z||ZE};
    else if(typeof v==='number')cell={t:'n',v,z:ZE};
    else cell={t:'s',v};
    ws[XLSX.utils.encode_cell({r,c})]=cell;maxC=Math.max(maxC,c);
  }));
  ws['!ref']=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:Math.max(rows.length-1,0),c:maxC}});
  ws['!cols']=widths.map(w=>({wch:w}));
  return ws;
}
function monthSheet(key){
  const m=S.months[key],c=compute(m),solo=S.mode==='solo',R=c.rows,n=R.length;
  const rows=[],add=a=>{rows.push(a);return rows.length};
  const col=i=>XLSX.utils.encode_col(1+i);
  add(['Budget Commun — '+monthName(key)]);
  add(['Type',MODES[S.mode],'Répartition',solo?'—':SPLITS_LONG[m.split]]);add([]);
  add(['Revenus','Salaire net','Part des revenus']);
  const rev0=rows.length+1,tot=rev0+n;
  R.forEach((r,i)=>add([r.name,r.salary,{f:`IF($B$${tot}=0,0,B${rev0+i}/$B$${tot})`,v:r.share,z:ZP}]));
  add(['Total',{f:`SUM(B${rev0}:B${tot-1})`,v:c.total},{f:`SUM(C${rev0}:C${tot-1})`,v:1,z:ZP}]);
  const block=(title,list,label)=>{add([]);add([title,'Montant']);const s=rows.length+1;list.forEach(l=>add([l.name||'—',r2(l.amount)]));const e=rows.length;return add([label,{f:e>=s?`SUM(B${s}:B${e})`:'0',v:sum(list)}])};
  const ft=block(solo?'Dépenses fixes':'Dépenses fixes communes',m.fixes,'Total fixes');
  const vt=block(solo?'Dépenses variables':'Dépenses variables communes',m.variables,'Total variables');
  add([]);const pot=add([solo?'DÉPENSES DU FOYER':'POT COMMUN MENSUEL',{f:`B${ft}+B${vt}`,v:c.pot}]);add([]);
  add([solo?'Mon budget':'Répartition — '+SPLITS_LONG[m.split],...R.map(r=>r.name)]);
  const sal=add(['Salaire',...R.map((r,i)=>({f:`B${rev0+i}`,v:r.salary}))]);
  const part=add(['Part des revenus',...R.map((r,i)=>({f:`C${rev0+i}`,v:r.share,z:ZP}))]);
  const virF=(split,i)=>solo?`$B$${pot}`:split==='egal'?`$B$${pot}/${n}`:split==='prorata'?`$B$${pot}*${col(i)}${part}`:`${col(i)}${sal}-($B$${tot}-$B$${pot})/${n}`;
  const vir=add([solo?'Dépenses du foyer':'Virement au compte commun',...R.map((r,i)=>({f:virF(m.split,i),v:r.contrib}))]);
  const fo=add(['Forfait mobile',...R.map(r=>r.forfait)]);
  const pe=add(['Dépenses perso',...R.map(r=>r.perso)]);
  const cr=add(['Crédits perso',...R.map(r=>r.credits)]);
  const reste=(i,v)=>`${col(i)}${sal}-${v}-${col(i)}${fo}-${col(i)}${pe}-${col(i)}${cr}`;
  const re=add(['Reste pour épargner',...R.map((r,i)=>({f:reste(i,col(i)+vir),v:r.reste}))]);
  add(["Taux d'épargne",...R.map((r,i)=>({f:`IF(${col(i)}${sal}=0,0,${col(i)}${re}/${col(i)}${sal})`,v:r.taux,z:ZP}))]);
  if(!solo){
    add([]);add(['Comparaison des options',...R.map(r=>'Virement '+r.name),...R.map(r=>'Reste '+r.name),'Choix']);
    for(const k of Object.keys(SPLITS)){
      const cc=compute(m,k),row=rows.length+1;
      add([SPLITS_LONG[k],...cc.rows.map((r,i)=>({f:virF(k,i),v:r.contrib})),...cc.rows.map((r,i)=>({f:reste(i,col(i)+row),v:r.reste})),m.split===k?'✓':'']);
    }
  }
  return sheetFrom(rows,[34,...Array(Math.max(2*n+1,3)).fill(18)]);
}
function exportXlsx(ks){
  if(typeof XLSX==='undefined'){toast("L'export Excel a besoin d'une connexion internet la première fois.");return}
  const wb=XLSX.utils.book_new();
  if(ks.length>1){
    const names=members(S.months[ks.at(-1)]);
    const rows=[['Mois','Répartition','Pot commun',...names.map(x=>'Virement '+x.name),...names.map(x=>'Reste '+x.name)]];
    ks.forEach(k=>{const c=compute(S.months[k]);const f=(id,p)=>{const r=c.rows.find(y=>y.id===id);return r?r2(r[p]):''};
      rows.push([cap(monthName(k)),S.mode==='solo'?'—':SPLITS[S.months[k].split],r2(c.pot),...names.map(x=>f(x.id,'contrib')),...names.map(x=>f(x.id,'reste'))])});
    const last=rows.length;
    rows.push(['Total','',...rows[0].slice(2).map((_,j)=>{const L=XLSX.utils.encode_col(2+j);let v=0;for(let i=1;i<last;i++)v+=+rows[i][2+j]||0;return{f:`SUM(${L}2:${L}${last})`,v}})]);
    XLSX.utils.book_append_sheet(wb,sheetFrom(rows,[18,20,...Array(rows[0].length-2).fill(16)]),'Synthèse');
  }
  ks.forEach(k=>XLSX.utils.book_append_sheet(wb,monthSheet(k),cap(monthName(k))));
  const out=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  download(new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),ks.length>1?`Budget_${ks[0]}_a_${ks.at(-1)}.xlsx`:`Budget_${ks[0]}.xlsx`);
}

render();
if('serviceWorker' in navigator&&location.protocol==='https:'&&/github\.io$/.test(location.hostname)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
})();
</script>
